<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emoji Mood Show</title>
  <link rel="stylesheet" href="fun.css" />
</head>
<body>
  <h1>🎭 Meet Emo the Emoji!</h1>

  <div id="emoji" title="Hover me 😁">😀</div>
  <p id="emojiText">I'm feeling great today!</p>

  <div id="chatBubble">Hi, I'm Emo! 💬</div>

  <div id="moodBarContainer">
    <div id="moodBar"></div>
  </div>

  <button onclick="randomMood()">🎲 Random Mood</button>
  <button onclick="cloneEmoji()">➕ Clone Me!</button>

  <div id="emojiArmy"></div>

  <script src="fun.js"></script>
</body>
</html>
