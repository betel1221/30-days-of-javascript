<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(236, 151, 151); /* Light gray background for the page */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Make body at least full viewport height */
            margin: 0;
            padding: 20px; /* Add some padding around the form */
            box-sizing: border-box; 
        }

        /* Form container styling */
        .contact-form {
            background-image: url('https://placehold.co/800x600/333333/ffffff/&text=FORM+BACKGROUND'); /* Placeholder image */
            background-size: cover;
            background-position: center;
            padding: 40px; /* Increased padding inside the form */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* Softer shadow */
            max-width: 500px;
            width: 100%; /* Make form responsive */
            margin: 20px auto; /* Add margin space around the form */
            text-align: left;
        }

        /* Fieldset and legend styling */
        fieldset {
            border: 1px solid rgba(255, 255, 255, 0.5); /* Semi-transparent white border */
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px; /* Space after fieldset */
        }

        legend {
            color: rgb(198, 42, 42); /* Text color white for legend */
            font-size: 1.5em;
            font-weight: bold;
            padding: 0 10px;
            /* background-color: transparent;  */
        }

        /* Label styling */
        label {
            display: block; /* Each label on its own line */
            color: rgb(198, 42, 42); /* Text color white for labels */
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95em;
        }

        /* Input text, file, and textarea styling */
        input[type="text"],
        input[type="file"],
        textarea {
            width: calc(100% - 20px); /* Full width minus padding */
            padding: 12px 10px;
            margin-bottom: 20px; /* Space after each input */
            border: 1px solid rgba(255, 255, 255, 0.4); /* Light border */
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.15); /* Slightly transparent background */
            color: rgb(113, 64, 64); /* Text color white */
            box-sizing: border-box; /* Include padding in width */
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.7); /* Lighter placeholder text */
        }

        /* Focus styles for inputs/textarea */
        input[type="text"]:focus,
        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: #4CAF50; /* Green highlight on focus */
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5); /* Subtle glow */
        }

        /* Radio button container */
        .radio-group {
            margin-bottom: 20px;
        }

        .radio-group div {
            display: inline-block; /* Keep radio buttons on one line */
            margin-right: 20px;
        }

        .radio-group input[type="radio"] {
            margin-right: 8px;
            /* Basic styling, custom styling for radios is more complex */
        }

        /* Submit button styling */
        input[type="submit"] {
            background-color: #007bff; /* Blue */
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            width: 100%; /* Make button full width */
            transition: background-color 0.3s ease; /* Smooth transition for hover */
        }

        /* Submit button hover effect */
        input[type="submit"]:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
    </style>
</head>
<body>

    <div class="contact-form">
        <form action="#" method="POST">
            <fieldset>
                <legend>Customer Information</legend>

                <div>
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                </div>

                <div class="radio-group">
                    <label>Sex</label>
                    <div>
                        <input type="radio" id="sex_male" name="sex" value="male" required>
                        <label for="sex_male" style="display: inline;">Male</label>
                    </div>
                    <div>
                        <input type="radio" id="sex_female" name="sex" value="female">
                        <label for="sex_female" style="display: inline;">Female</label>
                    </div>
                    <div>
                        <input type="radio" id="sex_other" name="sex" value="other">
                        <label for="sex_other" style="display: inline;">Other</label>
                    </div>
                </div>

                <div>
                    <label for="photo">Photo</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Type your message here..." required></textarea>
                </div>

                <input type="submit" value="Send Message">
            </fieldset>
        </form>
    </div>

</body>
</html>
