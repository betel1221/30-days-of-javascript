<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Attribute Example</title>

  <!-- General styles applied to all devices -->
  <link rel="stylesheet" href="base.css" />

  <!-- Styles for screens 769px and wider (desktop and large tablets) -->
  <link rel="stylesheet" href="desktop.css" media="screen and (min-width: 769px)" />

  <!-- Styles for screens 768px and narrower (mobile devices) -->
  <link rel="stylesheet" href="mobile.css" media="screen and (max-width: 768px)" />

  <!-- Styles specifically for printing -->
  <link rel="stylesheet" href="print.css" media="print" />
</head>
<body>
  <h1>Responsive Stylesheet Example</h1>
  <p>Resize your browser window or print this page to see different styles applied based on media queries.</p>
</body>
</html>
