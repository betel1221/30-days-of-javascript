<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Task Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/task.css" />
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1><i class="fas fa-tasks"></i> Task Manager</h1>
      <div class="header-actions">
        <span class="task-count" id="task-count">0 tasks</span>
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
      </div>
    </div>
    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>
    <div class="input-area">
      <input type="text" id="new-task" placeholder="Add a new task..." />
      <select id="priority">
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
      </select>
      <button id="add-btn"><i class="fas fa-plus"></i></button>
    </div>
    <div class="message-area">
      <span class="error-message" id="error-message">Task cannot be empty!</span>
      <span class="success-message" id="success-message">Task added successfully!</span>
    </div>
    <div class="filter-area">
      <button data-filter="all" class="filter active">All</button>
      <button data-filter="pending" class="filter">Pending</button>
      <button data-filter="done" class="filter">Completed</button>
    </div>
    <ul id="tasks"></ul>
    <div class="no-task-msg" id="no-tasks">No tasks yet. Start by adding one! 🚀</div>
  </div>
  <script src="./js/task.js"></script>
</body>
</html>
